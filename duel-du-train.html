<style>
  :root{
    --bg:#0b0d0a; --panel:#151913; --panel-2:#1c2317;
    --accent:#e2a13c; --accent-2:#c1442f;
    --text:#eae7dd; --text-dim:#9aa08f;
    --eligible:#6f9c5f; --ineligible:#8a5240; --border:#2c3326; --radius:10px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 50% -200px, rgba(226,161,60,0.08), transparent 60%),
      repeating-linear-gradient(135deg, rgba(255,255,255,0.015) 0 2px, transparent 2px 6px),
      var(--bg);
    color:var(--text); font-family:'Oswald','Arial Narrow',sans-serif; min-height:100vh; padding-bottom:40px;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  .wrap{max-width:480px; margin:0 auto; padding:14px 14px 0;}

  header{display:flex; align-items:center; justify-content:space-between; padding:10px 2px 14px; border-bottom:1px solid var(--border);}
  .langs{display:flex; gap:4px;}
  .lang-btn{
    background:transparent; border:1px solid var(--border); color:var(--text-dim);
    font-family:'JetBrains Mono',monospace; font-size:11px; padding:5px 7px; border-radius:5px;
    cursor:pointer; letter-spacing:1px;
  }
  .lang-btn.active{border-color:var(--accent); color:var(--accent); background:rgba(226,161,60,0.08);}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand svg{width:28px;height:28px;flex-shrink:0;}
  .brand-text .name{font-weight:700; font-size:18px; letter-spacing:2px; color:var(--accent); line-height:1;}
  .brand-text .sub{font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:2px; color:var(--text-dim); text-transform:uppercase;}

  .section-title{
    display:flex; align-items:center; gap:8px; margin:26px 0 10px; color:var(--text-dim); font-size:11px;
    letter-spacing:3px; text-transform:uppercase; font-family:'JetBrains Mono',monospace;
  }
  .section-title::before{content:''; width:14px; height:2px; background:var(--accent);}

  .board{
    background:linear-gradient(180deg, var(--panel-2), var(--panel)); border:1px solid var(--border); border-radius:var(--radius);
    padding:20px; text-align:center; box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), 0 10px 30px rgba(0,0,0,0.35);
  }
  .info-line{font-size:14px; color:var(--text-dim); line-height:1.5;}
  .info-line b{color:var(--accent);}

  .rules-box{text-align:left; background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:12px 14px; margin-bottom:14px;}
  .rules-title{font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--accent); margin-bottom:8px;}
  .rules-list{margin:0; padding-left:18px; font-size:13px; color:var(--text-dim); line-height:1.6;}
  .rules-list li{margin-bottom:4px;}
  .rules-list b{color:var(--text);}
  .tiebreak-tag{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-dim);}

  select{
    width:100%; background:#0e120d; border:1px solid var(--border); color:var(--text);
    padding:11px 10px; border-radius:8px; font-family:'Oswald',sans-serif; font-size:15px; margin-top:14px;
  }
  button{
    font-family:'Oswald',sans-serif; font-weight:600; letter-spacing:1px; text-transform:uppercase;
    font-size:14px; border:none; border-radius:8px; padding:12px 16px; cursor:pointer; width:100%; margin-top:14px;
  }
  .btn-primary{background:var(--accent); color:#1a1400;}
  .btn-primary:disabled{background:#3a3324; color:#6b6450; cursor:not-allowed;}
  .btn-secondary{background:var(--panel-2); color:var(--text); border:1px solid var(--border);}

  .level-label{font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:2px; color:var(--text-dim); text-transform:uppercase; margin-top:4px;}
  .level-number{font-size:15px; font-weight:600; color:var(--accent);}

  .dice-stage{margin:18px auto 6px; width:110px; height:110px; display:flex; align-items:center; justify-content:center;}
  .dice-face{
    width:100px; height:100px; border-radius:18px; background:#0e120d; border:2px solid var(--border);
    display:flex; align-items:center; justify-content:center; font-size:48px; font-weight:700;
    font-family:'JetBrains Mono',monospace; color:var(--text); transition:transform 0.15s ease, border-color 0.3s ease, color 0.3s ease;
  }
  .dice-face.spinning{animation:spin 0.15s linear infinite;}
  .dice-face.six{border-color:var(--eligible); color:var(--eligible);}
  .dice-face.dead{border-color:var(--accent-2); color:var(--accent-2);}
  @keyframes spin{
    0%{transform:rotate(0deg) scale(1);}
    50%{transform:rotate(8deg) scale(1.04);}
    100%{transform:rotate(-8deg) scale(1);}
  }

  .result-msg{font-size:15px; margin-top:10px; min-height:22px;}
  .result-msg.survived{color:var(--eligible);}
  .result-msg.dead{color:var(--accent-2);}

  .leaderboard{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;}
  .lb-row{
    display:grid; grid-template-columns:1fr auto auto; gap:10px; align-items:center;
    padding:10px 12px; font-size:14px; border-bottom:1px solid var(--border);
  }
  .lb-row:last-child{border-bottom:none;}
  .lb-row.head{
    font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:1.5px; text-transform:uppercase;
    color:var(--text-dim); background:var(--panel-2);
  }
  .lb-row .lvl{font-family:'JetBrains Mono',monospace; font-weight:700; color:var(--accent); text-align:center;}
  .lb-row .st{font-size:11px; text-align:right;}
  .lb-row .st.alive{color:var(--eligible);}
  .lb-row .st.dead{color:var(--accent-2);}
  .lb-row.me{background:rgba(226,161,60,0.08);}
  .empty-state{padding:20px 12px; text-align:center; color:var(--text-dim); font-size:13px;}
  .reset-zone{margin-top:18px; text-align:center;}
  .reset-zone button{width:auto; padding:8px 14px; font-size:11px;}

  .winner-banner{
    background:linear-gradient(180deg, rgba(226,161,60,0.18), rgba(226,161,60,0.05));
    border:1px solid var(--accent); border-radius:var(--radius); padding:22px 16px; text-align:center; margin-bottom:16px;
  }
  .winner-banner .trophy{font-size:36px;}
  .winner-banner .wname{font-size:22px; font-weight:700; color:var(--accent); margin-top:4px;}
  .winner-banner .wsub{font-size:12px; color:var(--text-dim); margin-top:4px;}

  footer{text-align:center; margin-top:28px; color:var(--text-dim); font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:1.5px;}
</style>
</head>

<div class="wrap">
  <header>
    <div class="brand">
      <svg viewBox="0 0 48 48" fill="none">
        <rect x="10" y="10" width="28" height="28" rx="5" fill="#e2a13c"/>
        <circle cx="17" cy="17" r="2.6" fill="#0e120d"/>

      <div class="brand-text">
        <div class="name">ITX</div>
        <div class="sub" id="brandSub">Duel du dimanche</div>
      </div>
    </div>
    <div class="langs">
      <button class="lang-btn" data-lang="fr">FR</button>
      <button class="lang-btn" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="es">ES</button>
      <button class="lang-btn" data-lang="it">IT</button>
    </div>
  </header>

  <div class="section-title"><span id="sectionGameTitle">La partie</span></div>

  <!-- Phase: pas dimanche -->
  <div id="phaseNotSunday" class="board" style="display:none;">
    <div class="info-line" id="notSundayText"></div>
  </div>

  <!-- Phase: avant l'ouverture -->
  <div id="phaseBefore" class="board" style="display:none;">
    <div class="info-line" id="beforeText"></div>
  </div>

  <!-- Phase: ouverte, sélection du joueur -->
  <div id="phaseSelect" class="board" style="display:none;">
    <div class="rules-box">
      <div class="rules-title" id="rulesTitle">Règles du duel</div>
      <ul class="rules-list" id="rulesListBody"></ul>
    </div>
    <div class="info-line" id="selectInfoText"></div>
    <select id="playerSelect"></select>
    <button class="btn-primary" id="confirmPlayerBtn"></button>
  </div>

  <!-- Phase: ouverte, tirage du nombre de départage -->
  <div id="phaseTiebreak" class="board" style="display:none;">
    <div class="info-line" id="tiebreakPlayerLine"><span id="tiebreakPlayerLabel"></span><b id="tiebreakPlayerName"></b></div>
    <div class="info-line" style="margin-top:8px;" id="tiebreakInfoText"></div>
    <div class="dice-stage"><div class="dice-face" id="tiebreakFace">?</div></div>
    <button class="btn-primary" id="tiebreakBtn"></button>
  </div>

  <!-- Phase: ouverte, jeu du joueur -->
  <div id="phasePlay" class="board" style="display:none;">
    <div class="info-line" id="playingAsLine"><span id="playingAsLabel"></span><b id="playingAsName"></b> <span class="tiebreak-tag" id="tiebreakTag"></span></div>
    <div class="level-label" id="levelLabel">Niveau atteint</div>
    <div class="level-number" id="levelNumber">0</div>
    <div class="dice-stage"><div class="dice-face" id="diceFace">?</div></div>
    <div class="result-msg" id="resultMsg"></div>
    <button class="btn-primary" id="rollBtn"></button>
    <button class="btn-secondary" id="changePlayerBtn"></button>
  </div>

  <!-- Phase: fermée -->
  <div id="phaseAfter" style="display:none;">
    <div class="winner-banner" id="winnerBanner">
      <div class="trophy">🏆</div>
      <div class="wname" id="winnerName"></div>
      <div class="wsub" id="winnerSub"></div>
    </div>
    <div class="info-line" style="margin-bottom:14px;" id="closedInfoLine"></div>
  </div>

  <div class="section-title"><span id="sectionLeaderboardTitle">Classement en direct</span></div>
  <div class="leaderboard">
    <div class="lb-row head"><span id="lbHeadName">Joueur</span><span id="lbHeadLvl">Niv.</span><span id="lbHeadStatus">Statut</span></div>
    <div id="leaderboardBody"></div>
  </div>

  <div class="reset-zone">
    <button class="btn-secondary" id="resetGameBtn"></button>
  </div>

  <footer>ITX — Duel du dimanche pour le train</footer>
</div>

      winnerSub:"Ha vinto il diritto di guidare il treno domenica prossima!",
      closedNoOne:"La partita di oggi è terminata. Nessuno ha giocato.",
      closedTieBroken:"Parità al livello {lvl} risolta dal numero di spareggio ({tb}).",
      closedFullTie:"Parità totale (stesso livello e stesso numero di spareggio) — da risolvere tra gli R4.",
      lbName:"Giocatore", lbLevel:"Liv.", lbStatus:"Stato", lbAlive:"In gioco", lbDead:"Eliminato",
      lbEmpty:"Nessuno ha ancora giocato oggi.",
      eliminatedMsg:"Eliminato! Livello raggiunto: {lvl}",
      continueMsg:"Hai superato {lvl} turno{s} — continua!",
      readyMsg:"Pronto a lanciare il tuo primo dado?",
      tiebreakTagText:"— spareggio: {tb}",
      resetBtn:"Reimposta la partita di oggi",
      resetConfirm:"Cancellare tutti i risultati della partita di oggi? Questa azione è definitiva.",
      footer:"ITX — Duello della domenica per il treno"
    }
  };

  function t(key){ return (I18N[lang] && I18N[lang][key] !== undefined) ? I18N[lang][key] : I18N.fr[key]; }
  function fmt(str, vars){
    return str.replace(/\{(\w+)\}/g, (m,k)=> (vars[k] !== undefined ? vars[k] : m));
  }

  function weightedDiceRoll(level){
    const p = sixProbabilityForLevel(level || 0);
    if(Math.random() < p) return 6;
    return 1 + Math.floor(Math.random()*5); // uniform among 1-5
  }

  // Renvoie l'heure/jour actuels tels qu'affichés en Italie (Europe/Rome),
  // pour que la fenêtre du jeu soit la même pour tout le monde peu importe son fuseau.
  function nowInRome(){
    const parts = new Intl.DateTimeFormat('en-US', {
      timeZone:'Europe/Rome', year:'numeric', month:'2-digit', day:'2-digit',
      hour:'2-digit', minute:'2-digit', hour12:false, weekday:'short'
    }).formatToParts(new Date());
    const map = {};
    parts.forEach(p => map[p.type] = p.value);
    return map;
  }

  function todayDateStr(){
    const r = nowInRome();
    return `${r.year}-${r.month}-${r.day}`;
  }

  function getPhase(){
    if(TEST_MODE_ALWAYS_OPEN) return 'open';
    const testOverride = new URLSearchParams(window.location.search).get('test');
    if(testOverride === 'open' || testOverride === 'before' || testOverride === 'after' || testOverride === 'not-sunday'){
      return testOverride;
    }
    const r = nowInRome();
    if(r.weekday !== 'Sun') return 'not-sunday';
    const h = parseInt(r.hour,10) + parseInt(r.minute,10)/60;
    if(h < WINDOW_START_HOUR) return 'before';
    if(h >= WINDOW_END_HOUR) return 'after';
    return 'open';
  }

  function initStorage(){
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();

    db.ref('members').on('value', snap=>{
      members = snap.val() || [];
      populatePlayerSelect();
      render();
    });

    const gameDate = todayDateStr();
    db.ref('sundayGame/' + gameDate + '/results').on('value', snap=>{
      currentResults = snap.val() || {};
      render();
    });

    // rafraîchit l'affichage régulièrement pour détecter le changement de phase (ouverture/fermeture automatique)
    setInterval(render, 30000);
  }

  function populatePlayerSelect(){
    const sel = $('playerSelect');
    const active = members.filter(m => m.status !== 'departed').sort((a,b)=>a.name.localeCompare(b.name));
    sel.innerHTML = `<option value="">${t('selectPlaceholder')}</option>` +
      active.map(m => `<option value="${m.id}">${escapeHtml(m.name)}</option>`).join('');
  }

  function hideAllPhases(){
    ['phaseNotSunday','phaseBefore','phaseSelect','phaseTiebreak','phasePlay','phaseAfter'].forEach(id=>{
      $(id).style.display = 'none';
    });
  }

  const TIME_VARS = {
    start: pad(WINDOW_START_HOUR) + 'h00',
    end: pad(WINDOW_END_HOUR) + 'h00',
    startUK: pad(WINDOW_START_HOUR - 1) + 'h00', // l'Italie a toujours 1h d'avance sur le Royaume-Uni
    endUK: pad(WINDOW_END_HOUR - 1) + 'h00'
  };

  function applyI18n(){
    $('brandSub').textContent = t('brandSub');
    $('sectionGameTitle').textContent = t('sectionGameTitle');
    $('sectionLeaderboardTitle').textContent = t('sectionLeaderboardTitle');
    $('notSundayText').innerHTML = fmt(t('notSunday'), TIME_VARS);
    $('beforeText').innerHTML = fmt(t('before'), TIME_VARS);
    $('rulesTitle').textContent = t('rulesTitle');
    $('rulesListBody').innerHTML = t('rules').map(r => `<li>${fmt(r, TIME_VARS)}</li>`).join('');
    $('selectInfoText').innerHTML = fmt(t('selectInfo'), TIME_VARS);
    $('confirmPlayerBtn').textContent = t('continueBtn');
    $('tiebreakInfoText').innerHTML = t('tiebreakInfo');
    $('tiebreakPlayerLabel').textContent = t('playerLine');
    $('playingAsLabel').textContent = t('playerLine');
    $('tiebreakBtn').textContent = t('drawBtn');
    $('levelLabel').textContent = t('levelLabel');
    $('rollBtn').textContent = t('rollBtn');
    $('changePlayerBtn').textContent = t('changePlayerBtn');
    $('winnerSub').textContent = t('winnerSub');
    $('lbHeadName').textContent = t('lbName');
    $('lbHeadLvl').textContent = t('lbLevel');
    $('lbHeadStatus').textContent = t('lbStatus');
    $('resetGameBtn').textContent = t('resetBtn');
    document.querySelector('footer').textContent = t('footer');
    document.querySelectorAll('.lang-btn').forEach(b=>{
      b.classList.toggle('active', b.dataset.lang === lang);
    });
    populatePlayerSelect();
    render();
  }

  function setLang(l){
    lang = l;
    applyI18n();
  }

  function render(){
    const phase = getPhase();

    hideAllPhases();
    renderLeaderboard();

    if(phase === 'not-sunday'){
      $('phaseNotSunday').style.display = 'block';
      return;
    }
    if(phase === 'before'){
      $('phaseBefore').style.display = 'block';
      return;
    }
    if(phase === 'after'){
      $('phaseAfter').style.display = 'block';
      renderWinner();
      return;
    }

    // phase === 'open'
    if(!myId){
      $('phaseSelect').style.display = 'block';
      return;
    }
    const rec = currentResults[myId];
    if(!rec || rec.tiebreak === undefined){
      $('phaseTiebreak').style.display = 'block';
      $('tiebreakPlayerName').textContent = myName;
    } else {
      $('phasePlay').style.display = 'block';
      renderPlayState();
    }
  }

  function renderWinner(){
    const entries = Object.keys(currentResults).map(id => ({id, ...currentResults[id]}));
    if(entries.length === 0){
      $('winnerBanner').style.display = 'none';
      $('closedInfoLine').textContent = t('closedNoOne');
      return;
    }
    const maxLevel = Math.max(...entries.map(e => e.level || 0));
    const topPlayers = entries.filter(e => (e.level || 0) === maxLevel);
    $('winnerBanner').style.display = 'block';
    if(topPlayers.length === 1){
      $('winnerName').textContent = topPlayers[0].name;
      $('closedInfoLine').textContent = '';
    } else {
      const maxTiebreak = Math.max(...topPlayers.map(p => p.tiebreak || 0));
      const finalWinners = topPlayers.filter(p => (p.tiebreak || 0) === maxTiebreak);
      if(finalWinners.length === 1){
        $('winnerName').textContent = finalWinners[0].name;
        $('closedInfoLine').textContent = fmt(t('closedTieBroken'), {lvl:maxLevel, tb:maxTiebreak});
      } else {
        $('winnerName').textContent = finalWinners.map(p=>p.name).join(' & ');
        $('closedInfoLine').textContent = t('closedFullTie');
      }
    }
  }

  async function rollTiebreak(){
    if(spinTimer) return;
    const btn = $('tiebreakBtn');
    const face = $('tiebreakFace');
    btn.disabled = true;
    face.classList.add('spinning');
    spinTimer = setInterval(()=>{
      face.textContent = String(1 + Math.floor(Math.random()*99));
    }, 70);
    await new Promise(r=> setTimeout(r, 900));
    clearInterval(spinTimer);
    spinTimer = null;
    face.classList.remove('spinning');
    const value = 1 + Math.floor(Math.random()*99);
    face.textContent = value;
    await new Promise(r=> setTimeout(r, 400));

    const gameDate = todayDateStr();
    const path = 'sundayGame/' + gameDate + '/results/' + myId;
    await db.ref(path).transaction(current=>{
      const rec = current || {name: myName, level:0, eliminated:false, history:[]};
      if(rec.tiebreak === undefined) rec.tiebreak = value;
      return rec;
    });
    btn.disabled = false;
    render();
  }

  function renderPlayState(){
    $('playingAsName').textContent = myName;
    const rec = currentResults[myId];
    const level = rec ? (rec.level || 0) : 0;
    $('levelNumber').textContent = level;
    $('tiebreakTag').textContent = rec && rec.tiebreak !== undefined ? fmt(t('tiebreakTagText'), {tb: rec.tiebreak}) : '';
    const rollBtn = $('rollBtn');
    const resultMsg = $('resultMsg');
    const dice = $('diceFace');

    if(rec && rec.eliminated){
      rollBtn.disabled = true;
      rollBtn.style.display = 'none';
      resultMsg.className = 'result-msg dead';
      resultMsg.textContent = fmt(t('eliminatedMsg'), {lvl: level});
      dice.classList.add('dead');
    } else {
      rollBtn.disabled = false;
      rollBtn.style.display = 'block';
      if(!spinTimer){
        resultMsg.className = 'result-msg';
        resultMsg.textContent = level > 0 ? fmt(t('continueMsg'), {lvl: level, s: level>1?'s':''}) : t('readyMsg');
        dice.classList.remove('dead','six');
        if(dice.textContent === '' || dice.textContent === 'undefined') dice.textContent = '?';
      }
    }
  }

  function renderLeaderboard(){
    const body = $('leaderboardBody');
    const entries = Object.keys(currentResults).map(id => ({id, ...currentResults[id]}))
      .sort((a,b)=> (b.level||0) - (a.level||0) || a.name.localeCompare(b.name));
    if(entries.length === 0){
      body.innerHTML = `<div class="empty-state">${t('lbEmpty')}</div>`;
      return;
    }
    body.innerHTML = entries.map(e=>{
      const statusCls = e.eliminated ? 'dead' : 'alive';
      const statusTxt = e.eliminated ? t('lbDead') : t('lbAlive');
      const meCls = e.id === myId ? 'me' : '';
      return `<div class="lb-row ${meCls}">
        <span>${escapeHtml(e.name)}</span>
        <span class="lvl">${e.level||0}</span>
        <span class="st ${statusCls}">${statusTxt}</span>
      </div>`;
    }).join('');
  }

  async function rollDice(){
    if(spinTimer) return;
    const rollBtn = $('rollBtn');
    const dice = $('diceFace');
    const resultMsg = $('resultMsg');
    rollBtn.disabled = true;
    dice.classList.add('spinning');
    dice.classList.remove('six','dead');
    resultMsg.textContent = '';

    spinTimer = setInterval(()=>{
      dice.textContent = String(1 + Math.floor(Math.random()*6));
    }, 80);

    await new Promise(r=> setTimeout(r, 900));
    clearInterval(spinTimer);
    spinTimer = null;
    dice.classList.remove('spinning');

    const currentLevel = (currentResults[myId] && currentResults[myId].level) || 0;
    const finalValue = weightedDiceRoll(currentLevel);
    dice.textContent = finalValue;

    const survived = finalValue === 6;
    if(survived) dice.classList.add('six'); else dice.classList.add('dead');

    await new Promise(r=> setTimeout(r, 350));
    await recordRoll(finalValue, survived);
    rollBtn.disabled = false;
    renderPlayState();
  }

  async function recordRoll(value, survived){
    const gameDate = todayDateStr();
    const path = 'sundayGame/' + gameDate + '/results/' + myId;
    await db.ref(path).transaction(current=>{
      const rec = current || {name: myName, level: 0, eliminated: false, history: []};
      if(rec.eliminated) return rec;
      rec.history = (rec.history || []).concat([value]);
      if(survived){ rec.level = (rec.level || 0) + 1; }
      else { rec.eliminated = true; }
      return rec;
    });
  }

  async function resetGame(){
    if(!window.confirm(t('resetConfirm'))) return;
    const gameDate = todayDateStr();
    await db.ref('sundayGame/' + gameDate).remove();
    myId = null; myName = null;
    render();
  }

  // ---- Init ----
  $('confirmPlayerBtn').addEventListener('click', ()=>{
    const sel = $('playerSelect');
    if(!sel.value) return;
    myId = sel.value;
    myName = sel.options[sel.selectedIndex].textContent;
    render();
  });
  $('changePlayerBtn').addEventListener('click', ()=>{
    myId = null; myName = null;
    render();
  });
  $('rollBtn').addEventListener('click', rollDice);
  $('tiebreakBtn').addEventListener('click', rollTiebreak);
  $('resetGameBtn').addEventListener('click', resetGame);
  document.querySelectorAll('.lang-btn').forEach(b=>{
    b.addEventListener('click', ()=> setLang(b.dataset.lang));
  });

  setLang('fr');
  initStorage();
})();
</script>
</body>
</html>
